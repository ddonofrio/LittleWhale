version: 1
applications:
  - appRoot: cloud/frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      customRules:
        - source: '/<*>'
          target: /index.html
          status: '404-200'
      cache:
        paths:
          - node_modules/**/*
